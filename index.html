<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Controller for Preact - Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 20px; }
      main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin: 20px 0; }
      .header, .sidebar { padding: 10px; border-radius: 4px; }
      .header { background: #f0f0f0; }
      .sidebar { background: #fff8e1; }
      button { margin-right: 5px; padding: 5px 10px; }
      #controls { margin: 10px 0; }
      #result { margin-top: 10px; padding: 10px; background: #e0f0e0; }
      ul { padding-left: 20px; margin: 5px 0; }
      input { padding: 2px 4px; width: 100%; box-sizing: border-box; margin-bottom: 5px; }
    </style>
  </head>
  <body>
    <h1>Visual Controller for Preact — v3 Region Demo</h1>
    <p>Two regions live inside one <code>&lt;main&gt;</code>. No <code>&lt;div id="..."&gt;</code> wrappers.</p>

    <main id="main">
      <h2>Static page heading</h2>
    </main>

    <div id="controls">
      <button id="updateHeader">Update header message</button>
      <button id="incrementHeader">Increment header count</button>
      <button id="swapApps">Swap apps</button>
      <button id="destroyHeader">Destroy header</button>
      <button id="destroySidebar">Destroy sidebar</button>
      <button id="resetAll">Reset all</button>
    </div>

    <div id="result">Result: <span id="resultText">-</span></div>
    <div id="hasResult">Aliases: <span id="aliasesList">-</span></div>

    <script type="module" src="/demo/main.jsx"></script>
  </body>
</html>
